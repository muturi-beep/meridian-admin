<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Admin — Users</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="logo">Meridian <em>Admin</em></div>
      <nav class="nav">
        <a href="/dashboard.html">Overview</a>
        <a href="/organizations.html">Organizations</a>
        <a href="/payments.html">Payments</a>
        <a href="/users.html" class="active">Users</a>
      </nav>
      <div class="user-menu">
        <span id="adminEmail"></span>
        <button onclick="logout()">Log out</button>
      </div>
    </header>

    <main class="container">
      <div class="page-head">
        <div>
          <h1>Users</h1>
          <p class="muted">Search for any user across all organizations.</p>
        </div>
      </div>

      <div class="controls">
        <input
          type="text"
          id="search"
          class="search-input"
          placeholder="Search by email, name, or phone..."
          oninput="debouncedSearch()"
          autofocus
        />
        <select id="filterRole" class="filter-select" onchange="loadUsers()">
          <option value="">All Roles</option>
          <option value="agency-director">Agency Director</option>
          <option value="property-manager">Property Manager</option>
          <option value="finance-officer">Finance Officer</option>
          <option value="maintenance-staff">Maintenance Staff</option>
          <option value="leasing-agent">Leasing Agent</option>
          <option value="tenant">Tenant</option>
          <option value="auditor">Auditor</option>
        </select>
      </div>

      <div id="content">
        <div class="loading">Loading users...</div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/users.js"></script>
  </body>
</html>
