<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Admin — Overview</title>
    <style>
      :root {
        --ink: #0c0f18;
        --ink-2: #131722;
        --ink-3: #1a2030;
        --ink-4: #222840;
        --copper: #b8834a;
        --copper-l: #d4a46a;
        --t1: #edf0f8;
        --t2: #7a83a0;
        --t3: #3a4260;
        --border: rgba(255, 255, 255, 0.08);
        --red: #f06060;
        --green: #3ecf8e;
        --amber: #f5a623;
        --blue: #4a9ef5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--ink);
        color: var(--t1);
        min-height: 100vh;
        line-height: 1.5;
      }
      .topbar {
        background: var(--ink-2);
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .logo {
        font-family: Georgia, serif;
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        margin-right: 24px;
      }
      .logo em {
        font-style: normal;
        color: var(--copper-l);
      }
      .nav {
        display: flex;
        gap: 4px;
        flex: 1;
      }
      .nav a {
        color: var(--t2);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
      }
      .nav a:hover {
        color: var(--t1);
        background: var(--ink-3);
      }
      .nav a.active {
        color: var(--copper-l);
        background: rgba(184, 131, 74, 0.12);
      }
      .user-menu {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: var(--t2);
      }
      .user-menu button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--t2);
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .user-menu button:hover {
        color: var(--red);
        border-color: rgba(240, 96, 96, 0.3);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px;
      }

      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 30px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      .muted {
        color: var(--t2);
        font-size: 13px;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--t1);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-outline:hover {
        border-color: var(--copper);
        color: var(--copper-l);
      }

      /* ── Big primary cards (4 across) ── */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 14px;
      }
      .stat-card {
        background: var(--ink-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px 22px 22px;
        transition:
          border-color 0.15s,
          transform 0.15s;
        position: relative;
        overflow: hidden;
      }
      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--copper),
          transparent
        );
        opacity: 0;
        transition: opacity 0.2s;
      }
      .stat-card:hover {
        border-color: rgba(184, 131, 74, 0.35);
        transform: translateY(-2px);
      }
      .stat-card:hover::before {
        opacity: 0.6;
      }
      .stat-card.highlight {
        border-color: rgba(184, 131, 74, 0.4);
        background: linear-gradient(
          135deg,
          var(--ink-2),
          rgba(184, 131, 74, 0.06)
        );
      }
      .stat-card.highlight::before {
        opacity: 0.4;
      }
      .stat-card.warn {
        border-color: rgba(245, 166, 35, 0.3);
      }

      .stat-label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--t2);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-value {
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }
      .stat-card.highlight .stat-value {
        color: var(--copper-l);
      }
      .stat-sub {
        font-size: 12px;
        color: var(--t2);
        margin-top: 8px;
        line-height: 1.4;
      }

      /* ── Compact secondary cards (smaller, 4 across) ── */
      .stats-row.small {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-bottom: 32px;
      }
      .stats-row.small .stat-card {
        padding: 16px 16px 15px;
        border-radius: 10px;
      }
      .stats-row.small .stat-card::before {
        display: none;
      }
      .stats-row.small .stat-label {
        font-size: 9.5px;
        margin-bottom: 6px;
      }
      .stats-row.small .stat-value {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .stats-row.small .stat-sub {
        font-size: 11px;
        margin-top: 5px;
      }
      .section {
        margin-bottom: 32px;
      }
      .section h2 {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 14px;
      }
      .alerts {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .alert-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--ink-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        text-decoration: none;
        color: inherit;
        transition: all 0.15s;
      }
      .alert-row:hover {
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateX(2px);
      }
      .alert-row.danger {
        border-left: 3px solid var(--red);
      }
      .alert-row.warn {
        border-left: 3px solid var(--amber);
      }
      .alert-row.info {
        border-left: 3px solid var(--blue);
      }
      .alert-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .alert-row.danger .alert-dot {
        background: var(--red);
      }
      .alert-row.warn .alert-dot {
        background: var(--amber);
      }
      .alert-row.info .alert-dot {
        background: var(--blue);
      }
      .alert-title {
        flex: 1;
        font-size: 13.5px;
        color: var(--t1);
      }
      .alert-count {
        background: var(--ink-3);
        color: var(--t1);
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 12px;
      }
      .alert-arrow {
        color: var(--t2);
      }

      .quick-links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }
      .quick-link {
        display: flex;
        gap: 14px;
        background: var(--ink-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        text-decoration: none;
        color: inherit;
        transition: all 0.15s;
        align-items: center;
      }
      .quick-link:hover {
        border-color: var(--copper);
        transform: translateY(-2px);
      }
      .ql-icon {
        font-size: 24px;
      }
      .ql-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--t1);
        margin-bottom: 2px;
      }
      .ql-desc {
        font-size: 11.5px;
        color: var(--t2);
      }

      .loading {
        text-align: center;
        padding: 80px 20px;
        color: var(--t2);
      }
      .error-box {
        background: rgba(240, 96, 96, 0.08);
        border: 1px solid rgba(240, 96, 96, 0.25);
        border-radius: 12px;
        padding: 32px;
        text-align: center;
      }
      .error-box h2 {
        color: var(--red);
        margin-bottom: 8px;
        font-size: 16px;
      }
      .error-box p {
        color: var(--t2);
        font-size: 13px;
        margin-bottom: 16px;
      }
      .error-box button {
        background: var(--copper);
        color: var(--ink);
        border: none;
        padding: 8px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }

      @media (max-width: 640px) {
        .container {
          padding: 20px 16px;
        }
        h1 {
          font-size: 24px;
        }
        .stat-value {
          font-size: 24px;
        }
        .nav {
          gap: 2px;
        }
        .nav a {
          padding: 6px 10px;
          font-size: 12px;
        }
        .logo {
          font-size: 15px;
          margin-right: 12px;
        }
        .user-menu span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="logo">Meridian <em>Admin</em></div>
      <nav class="nav">
        <a href="/dashboard.html" class="active">Overview</a>
        <a href="/organizations.html">Organizations</a>
        <a href="/payments.html">Payments</a>
        <a href="/users.html">Users</a>
      </nav>
      <div class="user-menu">
        <span id="adminEmail"></span>
        <button onclick="logout()">Log out</button>
      </div>
    </header>

    <main class="container">
      <div id="content">
        <div class="loading">Loading...</div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
